[project]
name = "skala-rag"
version = "0.1.0"
description = "AI 반도체 스타트업 투자 평가 Agentic RAG (SKALA 울산 4반 5조)"
readme = "README.md"
requires-python = "==3.11.*"   # 팀 전원 3.11 고정 (uv가 자동 설치)
dependencies = [
    "langgraph>=1.0.1",
    "langchain>=1.0.2",
    "langchain-community>=0.3.31",
    "langchain-openai>=1.0.1",
    "langchain-tavily>=0.2.12",
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.12.0",
    "FlagEmbedding>=1.3",    # bge-m3 dense + sparse(lexical weight)
    "pymupdf>=1.24",         # 디렉토리북 bbox 기반 컬럼 복원
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6"]
# 임베딩 비교군 3·4 (e5-base, e5 + Kiwi BM25)
eval = ["sentence-transformers>=5.1.1", "rank-bm25>=0.2.2", "kiwipiepy>=0.20"]

[tool.uv]
default-groups = ["dev"]
package = false
